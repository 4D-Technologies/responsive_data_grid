name: responsive_data_grid
description: Responsive Data Grid for Flutter inspired by Kendo UI's Grid functionality with full filtering, sorting, and paging that also responds dynamically to screen size using the same metaphor as bootstrap grid.
version: 1.1.2
homepage: https://github.com/4D-Technologies/responsive_data_grid/tree/main/responsive_data_grid
repository: https://github.com/4D-Technologies/responsive_data_grid
screenshots:
  - description: Kitchen sink with grouping, filters, multi-sort, search, and pager.
    path: doc/kitchen-sink.png
  - description: Example catalog covering data, paging, height, and column scenarios.
    path: doc/catalog.png

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ">=0.10.0 <1.0.0"

  darq: ^2.1.0
  bootstrap_grid: ^1.0.6
  date_field: ">=7.0.0 <8.0.0"
  infinite_scroll_pagination: ">=5.0.0 <6.0.0"
  material_ui: ">=1.1.0 <2.0.0"
  cupertino_ui: ">=1.0.0 <2.0.0"

  client_filtering: ^0.0.29

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
